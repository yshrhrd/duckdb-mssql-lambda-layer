name: Create Lambda Layer

on:
  push:
    tags: ['v*.*.*']
  workflow_dispatch:

jobs:
  build:
    runs-on: ${{ matrix.runner }}
    strategy:
      matrix:
        architecture: [x86_64, arm64]
        python-version: ['3.11', '3.12', '3.13', '3.14']
        include:
          - architecture: x86_64
            runner: ubuntu-latest
            platform: linux/amd64
          - architecture: arm64
            runner: ubuntu-24.04-arm
            platform: linux/arm64

    steps:
    - uses: actions/checkout@v4

    - name: Set up Docker Buildx
      uses: docker/setup-buildx-action@v3

    - name: Build the Docker image
      run: |
        docker buildx build --load --platform ${{ matrix.platform }} --build-arg PYTHON_VERSION=${{ matrix.python-version }} --file Dockerfile --tag duckdb-mssql-${{ matrix.architecture }} .

    - name: Extract layer zip
      run: |
        docker run --platform ${{ matrix.platform }} --rm --volume $(pwd):/tmp/out duckdb-mssql-${{ matrix.architecture }} cp /layer.zip /tmp/out/duckdb-mssql-python-${{ matrix.python-version }}-${{ matrix.architecture }}.zip

    - name: Run Tests
      run: |
        docker run --platform ${{ matrix.platform }} -d --name tester --entrypoint tail duckdb-mssql-${{ matrix.architecture }} -f /dev/null
        docker cp tests/test_duckdb_mssql.py tester:/tmp
        docker exec tester bash -c "pip install pytest"
        docker exec tester bash -c "PYTHONPATH=/opt/python pytest /tmp/test_duckdb_mssql.py"

    - name: Upload layer artifact
      uses: actions/upload-artifact@v4
      with:
        name: duckdb-mssql-python-${{ matrix.python-version }}-${{ matrix.architecture }}
        path: duckdb-mssql-python-${{ matrix.python-version }}-${{ matrix.architecture }}.zip
        retention-days: 7

  create-release:
    needs: build
    if: startsWith(github.ref, 'refs/tags/')
    runs-on: ubuntu-latest
    permissions:
      contents: write

    steps:
      - name: Download Artifacts
        uses: actions/download-artifact@v4

      - name: Create Release
        uses: ncipollo/release-action@v1
        with:
          allowUpdates: true
          artifacts: "duckdb-mssql-python-*/*.zip"
          token: ${{ secrets.GITHUB_TOKEN }}
          tag: ${{ github.ref_name }}
          body: |
            # DuckDB + mssql extension Lambda Layer

            > [!IMPORTANT]
            > Connect with `extension_directory=/opt/duckdb_extensions` and `home_directory=/tmp` before `LOAD mssql`.

            Choose `duckdb-mssql-python-<version>-<arch>.zip` matching your Lambda Python runtime (3.11–3.14) and architecture (x86_64 / arm64).
